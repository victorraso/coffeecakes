<div class="container sales-container">
    <div class="filter-section">
        <h5>Filter:</h5>
        <div class="row">
            <div class="col-12 col-sm-6 col-md-3">
                <label for="filter-year" class="form-label">Year:</label>
                <select id="filter-year" class="form-select">
                    
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <label for="filter-month" class="form-label">Month:</label>
                <select id="filter-month" class="form-select">
                    <option value="">All</option>
                    <option value="1">January</option>
                    <option value="2">February</option>
                    <option value="3">March</option>
                    <option value="4">April</option>
                    <option value="5">May</option>
                    <option value="6">June</option>
                    <option value="7">July</option>
                    <option value="8">August</option>
                    <option value="9">September</option>
                    <option value="10">October</option>
                    <option value="11">November</option>
                    <option value="12">December</option>
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <label for="filter-day" class="form-label">Day:</label>
                <select id="filter-day" class="form-select">
                    
                </select>
            </div>
            <div class="col-12 col-sm-6 col-md-3">
                <label for="filter-status" class="form-label">Status:</label>
                <select id="filter-status" class="form-select">
                    <option value="">All</option>
                    <option value="processing">Processing</option>
                    <option value="done">Done</option>
                </select>
            </div>
        </div>
    </div>   
      
    <div class="sort-menu">
        <h5>Sort By:</h5>
        <select id="sort-options" class="form-select ms-4">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="priceAsc">Price: Low to High</option>
            <option value="priceDesc">Price: High to Low</option>
        </select>
    </div>
    <div class="accordion accordion-flush" id="accordionFlush">
        
    </div>
</div>
<div class="container total-container">
    <h1>Total:</h1>
    <p></p>
</div>

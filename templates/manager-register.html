<div class="container register-employee">
    <h3 class="mb-4">Register New Employee</h3>

    <div id="message-container"></div>

    <form id="register-form" action="{{ url_for('manager_register') }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" class="form-control" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="registration_code">Registration Code</label>
            <input type="text" id="registration_code" name="registration_code" class="form-control" required autocomplete="off">
        </div>

        <button type="submit" class="btn btn-primary btn-block mt-2">Register</button>
    </form>
</div>

<div class="container delete-employee-container">
    <h3 class="mt-5">Delete Employee</h3>
    <div id="employees-list"></div> 
</div>
